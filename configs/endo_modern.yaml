target: endo
dataset_root: "Projet#2/ProjetDL2024/Dataset"
mask_dir_name: "masks endo"
output_dir: "outputs"

model:
  architecture: "modern_unet"
  input_size: [256, 256]
  base_filters: 32
  batch_norm: true
  dropout: 0.1

training:
  batch_size: 8
  epochs: 80
  learning_rate: 0.001
  seed: 123
  threshold: 0.5
  augment: true
  patience: 15
