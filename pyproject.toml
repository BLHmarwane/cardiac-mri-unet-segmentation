[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-unet-segmentation"
version = "0.1.0"
description = "Reproducible U-Net pipeline for cardiac endocardium and epicardium segmentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "tensorflow>=2.14",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
segmed = "segmed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
